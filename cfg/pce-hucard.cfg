MEMORY {
    ; ca65/ld65 zero-page symbols are linked as 8-bit offsets $00-$ff.
    ; On the HuC6280 these offsets address the CPU's fixed zero-page window
    ; at logical $2000-$20ff; they must therefore NOT be linked as $2000.
    ZP:      start = $0000, size = $0100, type = rw, define = yes;
    RAM:     start = $2200, size = $1E00, type = rw, define = yes;
    ROM:     start = $E000, size = $1FF6, type = ro, file = %O, fill = yes, fillval = $FF;
    VECTORS: start = $FFF6, size = $000A, type = ro, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE: load = ZP, type = zp, optional = yes;
    BSS:      load = RAM, type = bss, define = yes;
    STARTUP:  load = ROM, type = ro;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro, optional = yes;
    VECTORS:  load = VECTORS, type = ro;
}
