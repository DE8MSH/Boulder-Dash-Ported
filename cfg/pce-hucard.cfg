MEMORY {
    ZP:       start = $0000, size = $0100, type = rw, define = yes;
    RAM:      start = $2200, size = $1E00, type = rw, define = yes;

    ; Physical HuCard bank $00. HuC6280 reset forces MPR7=$00, so this bank
    ; must contain startup and vectors and is always visible at $E000-$FFFF.
    ROM0:     start = $E000, size = $1FF6, type = ro, file = %O, fill = yes, fillval = $FF;
    VECTORS:  start = $FFF6, size = $000A, type = ro, file = %O, fill = yes, fillval = $FF;

    ; Physical HuCard bank $01. Startup maps MPR6=$01, making this bank
    ; permanently visible at $C000-$DFFF. Large read-only assets live here.
    ROM1:     start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE:     load = ZP, type = zp, optional = yes;
    BSS:          load = RAM, type = bss, define = yes;
    STARTUP:      load = ROM0, type = ro;
    CODE:         load = ROM0, type = ro;
    RODATA:       load = ROM0, type = ro, optional = yes;
    BANK1_CODE:   load = ROM1, type = ro, optional = yes;
    BANK1_RODATA: load = ROM1, type = ro, optional = yes;
    VECTORS:      load = VECTORS, type = ro;
}
