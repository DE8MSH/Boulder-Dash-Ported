MEMORY {
    ZP:      start = $000000, size = $0100, type = rw, define = yes;
    WRAM:    start = $000200, size = $1E00, type = rw, define = yes;
    ROM:     start = $008000, size = $7FC0, type = ro, file = %O, fill = yes, fillval = $FF;
    HEADER:  start = $00FFC0, size = $0020, type = ro, file = %O, fill = yes, fillval = $00;
    VECTORS: start = $00FFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    ZEROPAGE: load = ZP, type = zp, optional = yes;
    BSS:      load = WRAM, type = bss, define = yes;
    STARTUP:  load = ROM, type = ro;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro, optional = yes;
    HEADER:   load = HEADER, type = ro;
    VECTORS:  load = VECTORS, type = ro;
}
